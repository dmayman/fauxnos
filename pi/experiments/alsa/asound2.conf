# --- Equalizer control ---
ctl.equal {
    type equal
}

# --- dmix over hardware ---
pcm.dmix_hw {
    type dmix
    ipc_key 1024
    ipc_perm 0666
    slave {
        pcm "hw:0,0"
        rate 44100
        period_time 0
        period_size 1024
        buffer_size 4096
    }
    bindings {
        0 0
        1 1
    }
}

# --- Equalizer feeding into dmix ---
pcm.plugequal {
    type equal
    slave.pcm "dmix_hw"
}

# --- Librespot softvol → plugequal → dmix → hw ---
pcm.softvol_librespot {
    type softvol
    slave.pcm "plugequal"
    control {
        name "LibrespotVolume"
        card 0
    }
    min_dB -60.0
    max_dB 0.0
    resolution 256
}

# --- Snapcast softvol → plugequal → dmix → hw ---
pcm.softvol_snapcast {
    type softvol
    slave.pcm "plugequal"
    control {
        name "SnapcastVolume"
        card 0
    }
    min_dB -60.0
    max_dB 0.0
    resolution 256
}

# --- Analog input softvol → plugequal → dmix → hw ---
pcm.softvol_analog {
    type softvol
    slave.pcm "plugequal"
    control {
        name "AnalogVolume"
        card 0
    }
    min_dB -60.0
    max_dB 0.0
    resolution 256
}

# --- System sounds softvol → plugequal → dmix → hw ---
pcm.softvol_system {
    type softvol
    slave.pcm "plugequal"
    control {
        name "SystemVolume"
        card 0
    }
    min_dB -60.0
    max_dB 0.0
    resolution 256
}

# --- System-wide default → system softvol ---
pcm.!default {
    type plug
    slave.pcm "softvol_system"
}

ctl.!default {
    type hw
    card 0
}