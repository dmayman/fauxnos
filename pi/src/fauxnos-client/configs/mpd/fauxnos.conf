# Fauxnos library player — one MPD per device, run by fauxnos-mpd.service
# as a user service. Installed to ~/.config/mpd/fauxnos.conf by
# setup-client.py (setup_local_sources).
#
# No music_directory / database on purpose: the MP3s live on the server
# (served at http://<server>:8080/library/...) and MPD streams them over
# HTTP, so nothing is copied to the SD card. Anything with a URL —
# including an internet radio stream — plays the same way.
#
# Control: the fauxnos daemon drives it with `mpc` on
# set/clients/<id>/library/play; Home Assistant's built-in MPD
# integration can point at <device>.local:6600 directly.

state_file          "~/.local/share/fauxnos-mpd/state"
# After a reboot, don't resume into a muted sink. The fauxnos daemon
# decides what plays.
restore_paused      "yes"

bind_to_address     "any"
port                "6600"

input {
    plugin "curl"
}

audio_output {
    type    "pulse"
    name    "Fauxnos Library"
    sink    "librarysink"
}
