// fauxnos AirPlay receiver config (shairport-sync 3.3.8)
//
// Architecture (2026-05-12): AirPlay is per-device. shairport-sync
// runs as a user systemd unit and outputs directly to the PA
// "airplaysink" null-sink whose monitor loops into the HiFiBerry
// ALSA out. The fauxnos source manager mutes/unmutes airplaysink
// like analog/snapsink — NO snapcast involvement.
//
// Volume authority: the iPhone is sole authority. shairport-sync
// does software volume attenuation on the PCM stream (because
// airplaysink is a null-sink with no hardware mixer); fauxnos pins
// the PA sink at 100 when airplay is the active source so the
// externally-attenuated audio passes through transparently.
//
// The fauxnos UI deliberately does NOT mirror the iPhone volume.
// We tried via the shairport metadata pipe — pvol events landed
// fine but the UI slider updates were unreliable across the broker
// hop on a Pi Zero 2 W. The fauxnos slider for the airplay source
// is locked + hides the percentage so users know to use the phone.

general =
{
    // The literal placeholder __FAUXNOS_NAME__ is substituted at install
    // time by setup-client.py setup_shairport() with the device's
    // display_name (Server / Kitchen / Garage / …). We deliberately
    // don't use shairport's %h macro: that gives the lowercase hostname
    // ("fauxnos001") and the AirPlay picker on iOS then capitalizes
    // the first letter ("Fauxnos001"), which is exactly the eyesore we
    // want to avoid. Display name = what the user named the device.
    name = "__FAUXNOS_NAME__";
    output_backend = "pa";
    interpolation = "soxr";                   // smoother re-sampling
    drift_tolerance_in_seconds = 0.002;
    resync_threshold_in_seconds = 0.050;
    volume_max_db = 0.0;                      // shairport software vol owns the user-control stage
    volume_range_db = 60;                     // typical iOS slider range
    audio_backend_buffer_desired_length_in_seconds = 0.2;
};

pa =
{
    sink = "airplaysink";
};

sessioncontrol =
{
    // Auto-claim the fauxnos airplay source on BOTH a fresh AirPlay
    // session start (entering_active_state — iOS picks fauxnos as
    // the AirPlay target) AND on the audio-about-to-start moment
    // (play_begins — also fires on resume-after-pause). The script
    // publishes set/clients/<id>/mode = airplay over MQTT; fauxnos's
    // source_manager handles the actual switch and no-ops on
    // duplicates so firing both is safe.
    //
    // No run_this_after_play_ends hook by design — we stay on the
    // airplay source after the session ends. User flips manually
    // when they want a different source (mirrors the Spotify
    // pattern: we don't auto-switch on pause).
    //
    // NOTE: paths are absolute as shairport requires. install.sh
    // should template the $HOME prefix at install time. On the
    // current ref deploy (fauxnos000) $HOME is /home/user.
    run_this_before_entering_active_state = "/home/user/.config/shairport-sync/claim-source.sh";
    run_this_before_play_begins = "/home/user/.config/shairport-sync/claim-source.sh";

    // Async — don't gate first-audio on the broker round-trip.
    wait_for_completion = "no";
};

diagnostics =
{
    log_verbosity = 1;
};
